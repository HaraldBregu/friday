name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:packages
      - run: npm run build:packages
      - run: npm pack --dry-run --workspace @friday/sdk
      - run: npm pack --dry-run --workspace @friday/cli
      - run: npm install --prefix extensions/demo
      - run: npm run build:demo
      - run: npm run build:coder
      - run: npm ci --prefix extensions/mermaid
      - run: npm run build --prefix extensions/mermaid
      - run: npm pack ./extensions/mermaid --dry-run
